[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micromvp"
version = "0.1.0"
description = "Modernized microMVP control stack"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "microMVP maintainers" }]

dependencies = [
  "PyQt6>=6.6",
  "numpy>=1.26",
  "opencv-contrib-python>=4.8",
  "pyserial>=3.5",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["rvg: needs the external RVG planner plugin installed"]
addopts = "-m 'not rvg'"
